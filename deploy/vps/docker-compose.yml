services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jusoor
      POSTGRES_USER: jusoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in deploy/vps/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jusoor -d jusoor"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # APP_ENVIRONMENT / CLIENT_DEMO_MODE are flipped together by ./mode.sh:
      #   demo -> Staging + ClientDemoMode (no Twilio/Azure needed)
      #   live -> Production (Azure Key Vault + Twilio REQUIRED, API refuses to boot without them)
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=jusoor;Username=jusoor;Password=${POSTGRES_PASSWORD};Include Error Detail=false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/vps/.env}
      Jwt__Issuer: ${JWT_ISSUER:-jusoor-api}
      Jwt__Audience: ${JWT_AUDIENCE:-jusoor-clients}
      Bootstrap__RunOnStartup: ${BOOTSTRAP_RUN_ON_STARTUP:-false}
      ClientDemoMode: ${CLIENT_DEMO_MODE:-false}
      UseLocalFieldEncryption: ${CLIENT_DEMO_MODE:-false}
      UseLocalOtp: "false"
      FieldEncryption__LocalKey: ${FIELD_ENCRYPTION_LOCAL_KEY:-}
      FieldEncryption__KeyVaultUri: ${FIELD_ENCRYPTION_KEY_VAULT_URI:-}
      FieldEncryption__KeyEncryptionKeyName: ${FIELD_ENCRYPTION_KEY_NAME:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__VerifyServiceSid: ${TWILIO_VERIFY_SERVICE_SID:-}
      Cors__AllowedOrigins__0: https://${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
      Cors__AllowedOrigins__1: https://www.${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
      # Newsroom logins created at startup when BOOTSTRAP_RUN_ON_STARTUP=true.
      # Blank email/password slots are skipped. Existing users are never re-passworded.
      DevSeed__Accounts__Slot1__Email: ${NEWSROOM_1_EMAIL:-}
      DevSeed__Accounts__Slot1__Password: ${NEWSROOM_1_PASSWORD:-}
      DevSeed__Accounts__Slot1__DisplayName: ${NEWSROOM_1_NAME:-}
      DevSeed__Accounts__Slot1__Role: ${NEWSROOM_1_ROLE:-EditorInChief}
      DevSeed__Accounts__Slot2__Email: ${NEWSROOM_2_EMAIL:-}
      DevSeed__Accounts__Slot2__Password: ${NEWSROOM_2_PASSWORD:-}
      DevSeed__Accounts__Slot2__DisplayName: ${NEWSROOM_2_NAME:-}
      DevSeed__Accounts__Slot2__Role: ${NEWSROOM_2_ROLE:-EditorInChief}
      DevSeed__Accounts__Slot3__Email: ${NEWSROOM_3_EMAIL:-}
      DevSeed__Accounts__Slot3__Password: ${NEWSROOM_3_PASSWORD:-}
      DevSeed__Accounts__Slot3__DisplayName: ${NEWSROOM_3_NAME:-}
      DevSeed__Accounts__Slot3__Role: ${NEWSROOM_3_ROLE:-EditorInChief}
      DevSeed__Accounts__Slot4__Email: ${NEWSROOM_4_EMAIL:-}
      DevSeed__Accounts__Slot4__Password: ${NEWSROOM_4_PASSWORD:-}
      DevSeed__Accounts__Slot4__DisplayName: ${NEWSROOM_4_NAME:-}
      DevSeed__Accounts__Slot4__Role: ${NEWSROOM_4_ROLE:-EditorInChief}
      DevSeed__Accounts__Slot5__Email: ${NEWSROOM_5_EMAIL:-}
      DevSeed__Accounts__Slot5__Password: ${NEWSROOM_5_PASSWORD:-}
      DevSeed__Accounts__Slot5__DisplayName: ${NEWSROOM_5_NAME:-}
      DevSeed__Accounts__Slot5__Role: ${NEWSROOM_5_ROLE:-EditorInChief}
      BackgroundJobs__Enabled: "true"
      SUPABASE_URL: ${SUPABASE_URL:?Set Supabase project URL}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-jusoor-media}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set Supabase service role key}
    networks: [internal]

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
      NEXT_PUBLIC_API_BASE_URL: https://api.${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
      API_INTERNAL_BASE_URL: http://api:8080
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN, e.g. gosour.net}
      ACME_EMAIL: ${ACME_EMAIL:?Set an email for TLS certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    name: jusoor-production
